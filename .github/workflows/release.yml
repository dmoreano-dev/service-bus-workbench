name: Release

# Runs when a version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# An odd minor version (0.1.x, 0.3.x) is published as a pre-release; an even one as a stable version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # sign in to Azure with the federated credential

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: src/code-extension
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/code-extension/package-lock.json
      - run: npm ci

      - name: Check that the tag matches the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag is $TAG but package.json says v$version."
            exit 1
          fi
          minor="$(echo "$version" | cut -d. -f2)"
          if [ $((minor % 2)) -eq 1 ]; then
            echo "PRE_RELEASE_FLAG=--pre-release" >> "$GITHUB_ENV"
            echo "RELEASE_FLAG=--prerelease" >> "$GITHUB_ENV"
          fi

      - name: Package
        run: npx vsce package --no-dependencies $PRE_RELEASE_FLAG --out "service-bus-workbench-$TAG.vsix"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the Marketplace
        run: npx vsce publish --packagePath "service-bus-workbench-$TAG.vsix" --azure-credential

      - name: Create the GitHub Release with the .vsix
        run: gh release create "$TAG" "service-bus-workbench-$TAG.vsix" --title "$TAG" --generate-notes $RELEASE_FLAG
        env:
          GH_TOKEN: ${{ github.token }}
